<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무관리 시스템 — 동화약품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg:        #ffffff;
  --bg2:       #f9f8f6;
  --bg3:       #f1efe8;
  --border:    rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.13);
  --text:      #1c1c1a;
  --text2:     #5f5e5a;
  --text3:     #888780;
  --r-md:      8px;
  --r-lg:      12px;
}
*  { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  background: var(--bg2); color: var(--text); font-size: 14px; line-height: 1.5;
}

/* ── Layout ─────────────────────────────────────── */
.layout { display: flex; min-height: 100vh; }

/* ── Sidebar ─────────────────────────────────────── */
.sb {
  width: 160px; min-width: 160px;
  background: var(--bg);
  border-right: 0.5px solid var(--border-md);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  flex-shrink: 0;
}
.sb-top { padding: .875rem .875rem .75rem; border-bottom: 0.5px solid var(--border); }
.sb-mark {
  width: 26px; height: 26px; border-radius: 6px;
  background: #E6F1FB; display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: #185FA5; margin-bottom: 5px; letter-spacing: -.3px;
}
.sb-name { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.3; }
.sb-sub  { font-size: 10px; color: var(--text3); margin-top: 1px; }
.nav-sec { font-size: 10px; color: var(--text3); padding: .5rem .875rem .15rem; letter-spacing: .05em; text-transform: uppercase; }
.nav-it {
  display: flex; align-items: center; gap: 6px;
  padding: 7px .875rem; font-size: 12px; color: var(--text2);
  cursor: pointer; border-left: 2px solid transparent;
  transition: all .13s; user-select: none;
}
.nav-it:hover { background: var(--bg2); color: var(--text); }
.nav-it.on     { background: var(--bg2); color: #185FA5; border-left-color: #378ADD; font-weight: 600; }
.nav-it.gong.on{ color: #0F6E56; border-left-color: #1D9E75; }
.nav-it i { font-size: 14px; flex-shrink: 0; }
.nav-div { height: 0.5px; background: var(--border); margin: .5rem .875rem .25rem; }

/* ── Main ────────────────────────────────────────── */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg); border-bottom: 0.5px solid var(--border-md);
  padding: .625rem 1.25rem;
  display: flex; align-items: center; justify-content: space-between;
}
.page-title { font-size: 15px; font-weight: 600; color: var(--text); }
.page-body  { padding: 1.25rem; max-width: 960px; }

/* ── Buttons ─────────────────────────────────────── */
.btn {
  padding: 5px 12px; border-radius: var(--r-md);
  border: 0.5px solid var(--border-md); background: transparent;
  font-size: 12px; color: var(--text); cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
  transition: background .12s; font-family: inherit; white-space: nowrap;
}
.btn:hover { background: var(--bg2); }
.btn-blue { background: #E6F1FB; color: #185FA5; border-color: #B5D4F4; }
.btn-blue:hover { background: #B5D4F4; }
.btn-teal { background: #E1F5EE; color: #0F6E56; border-color: #9FE1CB; }
.btn-teal:hover { background: #9FE1CB; }
.btn-sm   { padding: 3px 9px; font-size: 11px; }
.btn-danger { color: #A32D2D; border-color: #F7C1C1; }
.btn-danger:hover { background: #FCEBEB; }

/* ── Stats ───────────────────────────────────────── */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
  gap: 8px; margin-bottom: 1.1rem;
}
.stat-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-md); padding: .65rem .875rem; }
.stat-lbl  { font-size: 10px; color: var(--text2); margin-bottom: 2px; }
.stat-num  { font-size: 22px; font-weight: 600; color: var(--text); }
.stat-sub  { font-size: 10px; color: var(--text3); margin-top: 1px; }

/* ── Badges ──────────────────────────────────────── */
.bdg { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 10px; font-size: 11px; border: 0.5px solid; white-space: nowrap; }
.b-예  { background: #E6F1FB; color: #185FA5; border-color: #B5D4F4; }
.b-진  { background: #EAF3DE; color: #3B6D11; border-color: #C0DD97; }
.b-보  { background: #FAEEDA; color: #854F0B; border-color: #FAC775; }
.b-완  { background: #F1EFE8; color: #5F5E5A; border-color: #D3D1C7; }
.b-hi  { background: #FAECE7; color: #993C1D; border-color: #F5C4B3; }
.b-mi  { background: #FAEEDA; color: #854F0B; border-color: #FAC775; }
.b-lo  { background: #EAF3DE; color: #3B6D11; border-color: #C0DD97; }
.b-cat { background: var(--bg2);  color: var(--text2); border-color: var(--border-md); }
.b-gong{ background: #E1F5EE; color: #0F6E56; border-color: #9FE1CB; }

/* ── Filter tabs ─────────────────────────────────── */
.filter-row { display: flex; gap: 4px; margin-bottom: .875rem; flex-wrap: wrap; align-items: center; }
.ftab {
  padding: 4px 11px; border-radius: var(--r-md);
  border: 0.5px solid var(--border-md); background: var(--bg);
  font-size: 11px; color: var(--text2); cursor: pointer; font-family: inherit;
  transition: all .12s;
}
.ftab:hover { background: var(--bg2); }
.ftab.on    { background: #E6F1FB; color: #185FA5; border-color: #B5D4F4; }

/* ── Task list ───────────────────────────────────── */
.task-list { border: 0.5px solid var(--border-md); border-radius: var(--r-lg); overflow: hidden; background: var(--bg); }
.task-row  { border-bottom: 0.5px solid var(--border); }
.task-row:last-child { border-bottom: none; }
.task-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; cursor: pointer; transition: background .12s;
}
.task-head:hover { background: var(--bg2); }
.task-head.open  { background: var(--bg2); }
.task-ttl  { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.task-meta { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.task-due  { font-size: 10px; color: var(--text3); white-space: nowrap; }
.log-cnt   { font-size: 10px; color: var(--text3); display: flex; align-items: center; gap: 2px; }

/* ── Task detail ─────────────────────────────────── */
.task-detail { background: var(--bg2); border-top: 0.5px solid var(--border); padding: 11px 14px; }
.detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 12px; margin-bottom: 9px; }
.det-lbl { font-size: 10px; color: var(--text3); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .03em; }
.det-val { font-size: 12px; color: var(--text); }
.note-box { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-md); padding: 7px 10px; font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 9px; }
.log-hd   { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.log-ttl  { font-size: 12px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 5px; }

/* ── Log timeline ────────────────────────────────── */
.log-timeline { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.log-item { display: flex; gap: 9px; }
.log-dc   { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 62px; }
.log-dt   { font-size: 10px; color: var(--text3); font-weight: 500; text-align: center; line-height: 1.3; }
.log-dw   { display: flex; flex-direction: column; align-items: center; margin-top: 3px; }
.log-dot  { width: 7px; height: 7px; border-radius: 50%; background: #378ADD; }
.log-dot.gong { background: #1D9E75; }
.log-line { width: 1px; background: var(--border-md); flex: 1; min-height: 8px; margin-top: 2px; }
.log-body { flex: 1; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-md); padding: 7px 10px; min-width: 0; }
.log-auth { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
.log-cont { font-size: 12px; color: var(--text); line-height: 1.6; }

/* ── Log form ────────────────────────────────────── */
.log-form     { background: var(--bg); border: 0.5px solid var(--border-md); border-radius: var(--r-md); padding: 10px; }
.log-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 7px; }

/* ── Team cards (dashboard) ──────────────────────── */
.team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: .75rem; }
.team-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-lg); padding: .875rem; cursor: pointer; transition: border-color .13s; }
.team-card:hover  { border-color: var(--border-md); box-shadow: 0 2px 8px rgba(0,0,0,.04); }
.team-card.gong   { background: #E1F5EE; border-color: #9FE1CB; grid-column: 1 / -1; }
.team-card.gong:hover { border-color: #5DCAA5; }
.tc-name  { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: .5rem; }
.team-card.gong .tc-name { color: #085041; }
.bar-rows { display: flex; flex-direction: column; gap: 4px; }
.bar-row  { display: flex; align-items: center; gap: 6px; }
.bar-lbl  { font-size: 10px; color: var(--text3); width: 20px; text-align: right; }
.bar-track{ flex: 1; height: 4px; border-radius: 2px; background: var(--bg3); }
.team-card.gong .bar-track { background: rgba(255,255,255,.45); }
.bar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.bf-예 { background: #B5D4F4; } .bf-진 { background: #97C459; }
.bf-보 { background: #FAC775; } .bf-완 { background: #D3D1C7; }
.bar-cnt  { font-size: 10px; color: var(--text3); min-width: 14px; text-align: right; }
.team-card.gong .bar-cnt { color: #1D9E75; }
.tc-tot   { font-size: 10px; color: var(--text3); margin-top: .375rem; }
.team-card.gong .tc-tot { color: #1D9E75; }

/* ── Section heading ─────────────────────────────── */
.sec-hd { font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: .5rem; display: flex; align-items: center; gap: 5px; }

/* ── Recent logs (dashboard) ─────────────────────── */
.recent-wrap { border: 0.5px solid var(--border); border-radius: var(--r-lg); background: var(--bg); padding: 2px 12px; margin-bottom: 1.5rem; }
.recent-item { display: flex; gap: 9px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
.recent-item:last-child { border-bottom: none; }
.recent-dt { font-size: 10px; color: var(--text3); width: 56px; flex-shrink: 0; padding-top: 2px; }
.recent-bd { flex: 1; min-width: 0; }
.recent-team    { font-size: 10px; color: var(--text2); margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-content { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-author  { font-size: 10px; color: var(--text3); margin-top: 1px; }

/* ── Banner ──────────────────────────────────────── */
.banner      { border-radius: var(--r-md); padding: 8px 12px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; font-size: 12px; }
.banner-gong { background: #E1F5EE; border: 0.5px solid #9FE1CB; color: #085041; }

/* ── Forms ───────────────────────────────────────── */
.frow  { margin-bottom: .625rem; }
.frow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: .625rem; }
.flbl  { font-size: 11px; color: var(--text2); margin-bottom: 3px; display: block; }
input, select, textarea {
  width: 100%; font-size: 13px; font-family: inherit;
  padding: 6px 9px; border: 0.5px solid var(--border-md);
  border-radius: var(--r-md); background: var(--bg); color: var(--text);
  outline: none; transition: border-color .12s;
}
input:focus, select:focus, textarea:focus {
  border-color: #378ADD; box-shadow: 0 0 0 2px rgba(55,138,221,.1);
}
textarea { resize: vertical; min-height: 56px; }

/* ── Modal ───────────────────────────────────────── */
.modal-ov {
  position: fixed; inset: 0; background: rgba(0,0,0,.28);
  display: flex; align-items: flex-start; justify-content: center;
  z-index: 100; padding-top: 64px; overflow-y: auto;
}
.modal-bx {
  background: var(--bg); border: 0.5px solid var(--border-md);
  border-radius: var(--r-lg); padding: 1.25rem;
  width: 380px; max-width: calc(100vw - 2rem);
  box-shadow: 0 8px 32px rgba(0,0,0,.12);
}
.modal-title   { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 1rem; }
.modal-actions { display: flex; gap: 7px; margin-top: .875rem; justify-content: flex-end; }

/* ── Empty ───────────────────────────────────────── */
.empty { text-align: center; padding: 2rem 1rem; color: var(--text3); font-size: 13px; }
</style>
</head>

/* ── Storage (localStorage + migration) ──────────── */
function loadData() {
  // 1. Try current key
  try {
    const r = localStorage.getItem(SKEY);
    if (r) return JSON.parse(r);
  } catch(e) {}

  // 2. Try previous keys → migrate
  for (const key of PREV_KEYS) {
    try {
      const r = localStorage.getItem(key);
      if (!r) continue;
      let data = JSON.parse(r);
      // '팀공통' → '공통'
      data = data.map(t => ({ ...t, team: t.team === '팀공통' ? '공통' : t.team }));
      // Remove placeholder stub (id:21) that had no real content
      data = data.filter(t => !(t.id === 21 && t.title === '공통 업무 샘플 1'));
      // Deduplicate by id
      const seen = new Set();
      data = data.filter(t => { if (seen.has(t.id)) return false; seen.add(t.id); return true; });
      return data;
    } catch(e) {}
  }

  // 3. Fresh default
  return JSON.parse(JSON.stringify(DEF_TASKS));
}

function saveData() {
  try { localStorage.setItem(SKEY, JSON.stringify(S.tasks)); } catch(e) {}
}

const uid  = () => Math.max(0, ...S.tasks.map(t => t.id)) + 1;
const luid = t  => Math.max(0, ...t.logs.map(l => l.id)) + 1;

    S.modal ? rModal() : '';

  document.querySelectorAll('.nav-it').forEach(el =>
    el.classList.toggle('on', el.dataset.p === S.page));

    ab.className = `btn btn-sm ${addCls(S.page)}`;
    ab.innerHTML = `<i class="ti ti-plus" style="font-size:13px"></i>업무 추가`;

}

/* ── Event binding ───────────────────────────────── */
function bind() {
  // Navigation
  document.querySelectorAll('.nav-it, [data-goto]').forEach(el =>
    el.addEventListener('click', () => {
      S.page = el.dataset.p || el.dataset.goto;
      S.exp = null; S.fst = '전체'; S.lf = null;
      render();
    })
  );

  // Filter tabs
  document.querySelectorAll('[data-fst]').forEach(el =>
    el.addEventListener('click', () => { S.fst = el.dataset.fst; render(); })
  );

  // Toggle task expand
  document.querySelectorAll('[data-tg]').forEach(el =>
    el.addEventListener('click', () => {
      const id = +el.dataset.tg;
      S.exp = S.exp === id ? null : id;
      S.lf  = null;
      render();
    })
  );

  // Add / Edit task buttons
  document.querySelectorAll('[data-at], [data-et]').forEach(el =>
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (el.dataset.at) {
        S.modal = { type: 'addTask', team: el.dataset.at };
        S.ed    = { team: el.dataset.at, status: '예정', priority: '보통' };
      } else {
        const t = S.tasks.find(x => x.id === +el.dataset.et);
        if (!t) return;
        S.modal = { type: 'editTask', id: t.id };
        S.ed    = { ...t };
      }
      render();
    })
  );

  // Top-bar add button
  document.getElementById('top-add')?.addEventListener('click', () => {
    const dt = S.page !== 'dashboard' ? S.page : TEAMS[0];
    S.modal = { type: 'addTask', team: dt };
    S.ed    = { team: dt, status: '예정', priority: '보통' };
    render();
  });

  // Show log form
  document.querySelectorAll('[data-slf_show]').forEach(el =>
    el.addEventListener('click', e => {
      e.stopPropagation();
      S.lf = +el.dataset.slf_show;
      S.ld = { date: td(), content: '', author: '' };
      render();
    })
  );

  // Cancel log form
  document.querySelector('[data-clf]')?.addEventListener('click', () => {
    S.lf = null; render();
  });

  // Save log entry
  document.querySelectorAll('[data-slf]').forEach(el =>
    el.addEventListener('click', () => {
      const t = S.tasks.find(x => x.id === +el.dataset.slf);
      if (!t) return;
      const c = document.getElementById('lfc')?.value.trim();
      if (!c) { alert('진행 내용을 입력하세요.'); return; }
      t.logs.push({
        id:      luid(t),
        date:    document.getElementById('lfd')?.value || td(),
        content: c,
        author:  document.getElementById('lfa')?.value.trim() || '미입력'
      });
      saveData(); S.lf = null; render();
    })
  );

  // Delete log entry
  document.querySelectorAll('[data-dl]').forEach(el =>
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('이 진행 내역을 삭제하시겠습니까?')) return;
      const t = S.tasks.find(x => x.id === +el.dataset.dl);
      if (!t) return;
      t.logs = t.logs.filter(l => l.id !== +el.dataset.lid);
      saveData(); render();
    })
  );

  // Modal backdrop
  document.getElementById('mbg')?.addEventListener('click', () => { S.modal = null; render(); });

  // Modal cancel
  document.getElementById('c-btn')?.addEventListener('click', () => { S.modal = null; render(); });

  // Modal save
  document.getElementById('s-btn')?.addEventListener('click', () => {
    const ttl = document.getElementById('m-ttl')?.value.trim();
    if (!ttl) { alert('업무명을 입력하세요.'); return; }
    const obj = {
      title:    ttl,
      team:     document.getElementById('m-tm')?.value,
      status:   document.getElementById('m-st')?.value,
      priority: document.getElementById('m-pr')?.value,
      assignee: document.getElementById('m-as')?.value.trim(),
      due:      document.getElementById('m-du')?.value,
      category: document.getElementById('m-ct')?.value.trim(),
      note:     document.getElementById('m-nt')?.value.trim()
    };
    if (S.modal.type === 'editTask') {
      const t = S.tasks.find(x => x.id === S.modal.id);
      if (t) Object.assign(t, obj);
    } else {
      S.tasks.push({ id: uid(), ...obj, logs: [] });
    }
    saveData(); S.modal = null; render();
  });

  // Modal delete task
  document.getElementById('d-btn')?.addEventListener('click', () => {
    if (!confirm('이 업무를 삭제하시겠습니까?')) return;
    S.tasks = S.tasks.filter(t => t.id !== S.modal.id);
    saveData(); S.modal = null; S.exp = null; render();
  });

  // Team select in modal → refresh button color
  document.getElementById('m-tm')?.addEventListener('change', e => {
    S.ed.team = e.target.value; render();
  });
}

/* ── Init ────────────────────────────────────────── */
S.tasks = loadData();
saveData(); // persist migrated data under new key
render();
</script>
</body>
</html>
