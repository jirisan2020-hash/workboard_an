<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBoard — 동화약품 영업기획부문</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3B6FED; --blue-bg:#DBEAFE; --blue-text:#1D4ED8;
  --green-bg:#DCFCE7; --green-text:#15803D;
  --orange-bg:#FFEDD5; --orange-text:#C2410C;
  --pink-bg:#FCE7F3; --pink-text:#BE185D;
  --red:#DC2626; --red-bg:#FEE2E2;
  --purple:#7C3AED; --purple-bg:#EDE9FE;
  --amber:#D97706; --amber-bg:#FEF3C7;
  --teal-bg:#CCFBF1; --teal-text:#0F766E;
  --indigo-bg:#E0E7FF; --indigo-text:#4338CA;
  --lime-bg:#ECFCCB; --lime-text:#4D7C0F;
  --cyan-bg:#CFFAFE; --cyan-text:#0E7490;
  --gray-bg:#F3F4F6; --border:#E5E7EB; --text:#111827; --text2:#6B7280; --text3:#9CA3AF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#F9FAFB;color:var(--text);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:0 1.5rem 3rem}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.hd-inner{max-width:1280px;margin:0 auto;padding:.75rem 1.5rem;display:flex;align-items:center;gap:1.75rem}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--text)}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
nav{display:flex;gap:4px}
.tab{padding:7px 16px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:transparent;transition:all .15s}
.tab:hover{background:#F3F4F6}
.tab.on{background:var(--blue);color:#fff}
.pg-hd{display:flex;align-items:center;justify-content:space-between;margin:1.5rem 0 1rem}
.pg-hd h1{font-size:20px;font-weight:700}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:1.25rem}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:.9rem;text-align:center;cursor:pointer;transition:all .15s}
.kpi:hover{border-color:#D1D5DB}
.kpi.sel{border:2px solid var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpi-num{font-size:26px;font-weight:700;line-height:1.2}
.kpi-lbl{font-size:12px;color:var(--text2);margin-top:2px}
.kpi-chk{font-size:10px;color:var(--text3);margin-top:1px}
.ai-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.ai-left{flex:1}
.ai-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ai-desc{font-size:12.5px;color:var(--text2)}
.btn-blue{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-blue:hover{background:#2F5DDB}
.ai-result{margin-top:.875rem;padding-top:.875rem;border-top:1px solid var(--border);font-size:13px;line-height:1.7;color:var(--text);display:none}
.ai-result.show{display:block}
.ai-flag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-right:4px}
.team-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:1.25rem}
.team-card{border-radius:10px;padding:.875rem 1rem;border:1px solid var(--border)}
.tc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tc-name{font-size:13px;font-weight:700}
.tc-tot{font-size:12px;color:var(--text2)}
.tc-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 10px;border-radius:14px;font-size:12px;font-weight:600;white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:.875rem;flex-wrap:wrap}
.toolbar h2{font-size:15px;font-weight:700;margin-right:6px}
input[type=text],input[type=date],select,textarea{font-family:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,111,237,.12)}
.search-in{flex:1;min-width:140px;max-width:260px}
.sort-grp{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.sort-btn{padding:7px 13px;font-size:12.5px;color:var(--text2);background:#fff;border:none;cursor:pointer}
.sort-btn.on{background:var(--gray-bg);color:var(--text);font-weight:600}
.spacer{flex:1}
.tbl-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--text2);font-weight:600;padding:10px 14px;background:#FAFBFC;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid #F1F2F4;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFC}
.task-title{font-weight:600;color:var(--text);cursor:pointer}
.task-title:hover{color:var(--blue);text-decoration:underline}
.task-desc{font-size:11.5px;color:var(--text3);margin-top:2px}
.status-sel{border:none;border-radius:14px;font-size:12px;font-weight:600;padding:3px 10px;cursor:pointer}
.act-link{font-size:12.5px;color:var(--blue);cursor:pointer;font-weight:500;margin-right:8px}
.act-link.danger{color:var(--red)}
.act-link:hover{text-decoration:underline}
.empty{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px}
.btn-add{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-add:hover{background:#2F5DDB}
.form-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1.5rem;max-width:560px}
.frow{margin-bottom:1rem}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
.flbl{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;display:block}
.flbl .req{color:var(--red)}
.form-card input,.form-card select,.form-card textarea{width:100%}
.form-card textarea{min-height:90px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem}
.btn-plain{background:#fff;border:1px solid var(--border);padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text)}
.btn-plain:hover{background:var(--gray-bg)}
.modal-ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:56px 16px;overflow-y:auto}
.modal-bx{background:#fff;border-radius:12px;padding:1.5rem;width:480px;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.modal-bx.wide{width:600px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:1.1rem}
.det-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px;margin-bottom:.875rem;padding-bottom:.875rem;border-bottom:1px solid var(--border)}
.det-lbl{font-size:11px;color:var(--text3);margin-bottom:2px}
.det-val{font-size:13px;font-weight:500}
.note-box{background:var(--gray-bg);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:1rem}
.log-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.log-hd h3{font-size:13px;font-weight:700}
.log-item{display:flex;gap:10px;margin-bottom:8px}
.log-dt{font-size:11px;color:var(--text3);width:78px;flex-shrink:0;padding-top:2px}
.log-bd{flex:1;background:var(--gray-bg);border-radius:8px;padding:8px 11px;font-size:13px}
.log-auth{font-size:11px;color:var(--text3);margin-bottom:2px}
.log-del{float:right;font-size:11px;color:var(--red);cursor:pointer}
.log-form{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px}
.log-form .frow2{margin-bottom:8px}
.log-form .frow{margin-bottom:8px}
.org-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:.875rem;flex-wrap:wrap}
.grade-pill{padding:5px 12px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--text2)}
.grade-pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grade-badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:22px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
.g-A{background:#16A34A}.g-AA{background:#D97706}.g-AAA{background:#DC2626}
.set-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem;max-width:560px}
.set-title{font-size:14px;font-weight:700;margin-bottom:.875rem}
.team-edit-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.cat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--gray-bg);border-radius:8px;margin-bottom:6px;font-size:13px}
.cat-x{color:var(--text3);cursor:pointer;font-size:15px}
.cat-x:hover{color:var(--red)}
.cat-add-row{display:flex;gap:8px;margin-bottom:.875rem}
.cat-add-row input{flex:1}
.danger-box{border:1px solid #FCA5A5;background:#FEF2F2;border-radius:10px;padding:1rem 1.25rem}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.btn-danger:hover{background:var(--red-bg)}
@media(max-width:900px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .team-row{grid-template-columns:repeat(2,1fr)}
  .det-grid{grid-template-columns:repeat(2,1fr)}
  table{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
</head>
<body>

<header>
  <div class="hd-inner">
    <div class="logo"><span class="logo-mark">W</span>WorkBoard</div>
    <nav id="nav">
      <button class="tab" data-pg="dashboard">대시보드</button>
      <button class="tab" data-pg="input">업무 입력</button>
      <button class="tab" data-pg="org">조직관리</button>
      <button class="tab" data-pg="settings">설정</button>
    </nav>
  </div>
</header>

<div class="wrap" id="page"></div>
<div id="modal-root"></div>

<script>
const STATUS = ['긴급','진행중','예정','보류','완료'];

const SKEY = 'dw_workboard_v1';

const TEAM_PALETTE = [

  {id:3, team:'영업기획팀', category:'정보시각화', title:'Sales Report 개선', desc:'영업정보의 대시보드화 작업', assignee:'김영혜', status:'진행중', priority:'보통', due:'2026-06-30', logs:[]},

  {id:6, team:'영업기획팀', category:'업무프로세스', title:'신입사원 교육자료 작성', desc:'MR(신입) 교육자료 준비', assignee:'김영혜', status:'진행중', priority:'보통', due:'2026-06-30', logs:[]},
  {id:7, team:'영업기획팀', category:'업무프로세스', title:'사업부별 영역 혼합 이슈 및 대응', desc:'약국-생활건강 경계 소멸에 대한 이슈점검 및 대응 방안 수립', assignee:'김영혜', status:'예정', priority:'보통', due:'2026-06-30', logs:[]},
  {id:8, team:'영업지원팀', category:'조직관리',   title:'영업지원팀 업무 포지션 조정', desc:'영업지원팀 내 지점사무-마케팅지원 업무 조정 (신가혜 퇴사 예정)', assignee:'이현기', status:'진행중', priority:'보통', due:'2026-07-31', logs:[]},

  {id:14,team:'영업기획팀', category:'업무프로세스', title:'전자문서 도입', desc:'신규거래선 등록 전자문서화', assignee:'김영혜', status:'진행중', priority:'보통', due:'2026-09-30', logs:[]},
  {id:15,team:'영업기획팀', category:'업무프로세스', title:'온라인몰 활성화', desc:'온라인몰 개선 기획안 제출', assignee:'김영혜', status:'진행중', priority:'보통', due:'2026-09-30', logs:[]},
  {id:16,team:'물류지원팀', category:'조직관리',   title:'물류지원팀 조직 강화', desc:'물류지원팀 조직 쇄신', assignee:'오재용', status:'예정', priority:'보통', due:'2026-09-30', logs:[]}
];

const SEED_ORGLOGS = [
  {id:1, date:'2026-05-25', team:'물류지원팀', member:'김바다', grade:'A',   content:'생활건강 - 물류지원 업무 협조 이슈여부 확인 및 R&R 정립 (기획관리 요청사항)'},
  {id:2, date:'2026-05-07', team:'영업지원팀', member:'이현기', grade:'AAA', content:'대표님 남부지점 방문 솔선수범 사전 점검'},
  {id:3, date:'2026-05-06', team:'물류지원팀', member:'김바다', grade:'A',   content:'3PL업무인수인계 과정 미흡'}
];

let S = { page:'dashboard', data:null, kpiFilter:'전체', search:'', teamFilter:'전체', sortMode:'due', modal:null, ed:{} };

function loadData(){
  try{ const r = localStorage.getItem(SKEY); if(r) return JSON.parse(r); }catch(e){}
  return { teams: JSON.parse(JSON.stringify(SEED_TEAMS)), tasks: JSON.parse(JSON.stringify(SEED_TASKS)), orgLogs: JSON.parse(JSON.stringify(SEED_ORGLOGS)), extraCategories: [] };
}
function saveData(){ try{ localStorage.setItem(SKEY, JSON.stringify(S.data)); }catch(e){} }
const uid = arr => Math.max(0, ...arr.map(x=>x.id)) + 1;
const td  = () => new Date().toISOString().slice(0,10);
const fmtDue = iso => { if(!iso) return '-'; const p=iso.split('-'); return (+p[1])+'월 '+(+p[2])+'일'; };
const teamOf = name => S.data.teams.find(t=>t.name===name) || {bg:'var(--gray-bg)',text:'var(--text2)'};
function categories(){
  const set = new Set();
  S.data.tasks.forEach(function(t){ if(t.category) set.add(t.category); });
  (S.data.extraCategories||[]).forEach(function(c){ set.add(c); });
  return Array.from(set);
}

function render(){
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.pg===S.page); });
  const el = document.getElementById('page');
  if(S.page==='dashboard') el.innerHTML = rDashboard();
  else if(S.page==='input') el.innerHTML = rInputPage();
  else if(S.page==='org') el.innerHTML = rOrgPage();
  else if(S.page==='settings') el.innerHTML = rSettingsPage();

function runAnalysis(){
  const today = new Date(td());
  const tasks = S.data.tasks.filter(function(t){return t.status!=='완료';});
  const dday = function(t){ return Math.ceil((new Date(t.due) - today) / 86400000); };
  const overdue = tasks.filter(function(t){return dday(t) < 0;});
  const soon = tasks.filter(function(t){return dday(t) >= 0 && dday(t) <= 7;});
  const noLog = tasks.filter(function(t){return (!t.logs || t.logs.length===0) && t.status==='진행중';});
  const urgent = tasks.filter(function(t){return t.status==='긴급';});
  let html = '';
  if(urgent.length) html += '<div style="margin-bottom:8px"><span class="ai-flag" style="background:var(--red-bg);color:var(--red)">긴급 '+urgent.length+'건</span> '+urgent.map(function(t){return t.title;}).join(', ')+'</div>';
  if(overdue.length) html += '<div style="margin-bottom:8px"><span class="ai-flag" style="background:var(--red-bg);color:var(--red)">기한 초과 '+overdue.length+'건</span> '+overdue.map(function(t){return t.title+'('+fmtDue(t.due)+')';}).join(', ')+'</div>';
  if(soon.length) html += '<div style="margin-bottom:8px"><span class="ai-flag" style="background:var(--amber-bg);color:var(--amber)">마감임박(7일내) '+soon.length+'건</span> '+soon.map(function(t){return t.title+'('+fmtDue(t.due)+')';}).join(', ')+'</div>';
  if(noLog.length) html += '<div style="margin-bottom:8px"><span class="ai-flag" style="background:var(--purple-bg);color:var(--purple)">진행내역 미기록 '+noLog.length+'건</span> '+noLog.map(function(t){return t.title;}).join(', ')+'</div>';
  if(!html) html = '<div style="color:var(--text2)">현재 마감임박·긴급·미기록 업무가 없습니다.</div>';
  html += '<div style="margin-top:6px;font-size:11.5px;color:var(--text3)">* 외부 API 연동 없이 등록된 데이터 기준으로 자동 분석한 결과입니다.</div>';
  return html;
}

    '<div class="cat-add-row"><input type="text" id="new-cat" placeholder="새 분류 입력 후 Enter 또는 추가"><button class="btn-blue" id="add-cat-btn">＋ 추가</button></div>'+
    catRows+'</div>'+
  '<div class="set-card"><div class="set-title">데이터 초기화</div>'+
    '<div class="danger-box"><button class="btn-danger" id="reset-btn">전체 업무 초기화</button>'+
    '<div style="font-size:11.5px;color:var(--text2);margin-top:8px">모든 업무·조직관리일지 데이터가 영구적으로 삭제됩니다. 복구할 수 없습니다.</div></div></div>';
}

function rModal(){
  if(S.modal.type==='detail') return rDetailModal(S.modal.id);
  if(S.modal.type==='addTask' || S.modal.type==='editTask') return rTaskFormModal();
  if(S.modal.type==='addOrg' || S.modal.type==='editOrg') return rOrgFormModal();
  return '';
}

function readTaskForm(id){
  return {
    id: id,
    title: document.getElementById('f-title').value.trim(),
    team: document.getElementById('f-team').value,
    category: document.getElementById('f-cat').value.trim(),
    status: document.getElementById('f-status').value,
    priority: document.getElementById('f-priority').value,
    due: document.getElementById('f-due').value,
    assignee: document.getElementById('f-assignee').value.trim(),
    desc: document.getElementById('f-desc').value.trim(),
    logs: []
  };
}
function saveTaskForm(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ alert('업무명을 입력하세요.'); return; }
  if(S.modal.type==='editTask'){
    const t = S.data.tasks.find(function(x){return x.id===S.modal.id;});
    if(t){ const updated = readTaskForm(t.id); updated.logs = t.logs; Object.assign(t, updated); }
  } else {
    S.data.tasks.push(readTaskForm(uid(S.data.tasks)));
  }
  saveData(); S.modal=null; render();
}
function addCatFromInput(){
  const inp = document.getElementById('new-cat');
  const v = inp.value.trim();
  if(!v) return;
  inp.value='';
  S.data.extraCategories = S.data.extraCategories || [];
  if(categories().indexOf(v)===-1) S.data.extraCategories.push(v);
  saveData(); render();
}
function addTeamFromInput(){
  const inp = document.getElementById('new-team');
  const v = inp.value.trim();
  if(!v) return;
  if(S.data.teams.some(function(t){return t.name===v;})){ alert('이미 존재하는 팀 이름입니다.'); return; }
  if(S.data.teams.length >= TEAM_PALETTE.length){ alert('팀은 최대 '+TEAM_PALETTE.length+'개까지 추가할 수 있습니다.'); return; }
  inp.value='';
  const palette = TEAM_PALETTE[S.data.teams.length % TEAM_PALETTE.length];
  S.data.teams.push({ name:v, color:palette.color, bg:palette.bg, text:palette.text });
  saveData(); render();
}

function bind(){
  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ S.page=b.dataset.pg; S.modal=null; render(); }); });
  document.querySelectorAll('[data-kpi]').forEach(function(el){ el.addEventListener('click', function(){ S.kpiFilter=el.dataset.kpi; render(); }); });
  const si = document.getElementById('search-in'); if(si) si.addEventListener('input', function(e){ S.search=e.target.value; render(); });
  const tf = document.getElementById('team-filter'); if(tf) tf.addEventListener('change', function(e){ S.teamFilter=e.target.value; render(); });
  document.querySelectorAll('[data-sort]').forEach(function(el){ el.addEventListener('click', function(){ S.sortMode=el.dataset.sort; render(); }); });
  const atb = document.getElementById('add-task-btn'); if(atb) atb.addEventListener('click', function(){ S.modal={type:'addTask'}; S.ed={status:'예정',priority:'보통',team:S.data.teams[0].name}; render(); });
  const air = document.getElementById('ai-run'); if(air) air.addEventListener('click', function(){ const r=document.getElementById('ai-result'); r.innerHTML=runAnalysis(); r.classList.add('show'); });
  document.querySelectorAll('[data-detail]').forEach(function(el){ el.addEventListener('click', function(){ S.modal={type:'detail', id:+el.dataset.detail, showLogForm:false}; render(); }); });
  document.querySelectorAll('[data-edit]').forEach(function(el){ el.addEventListener('click', function(){ const t=S.data.tasks.find(function(x){return x.id===+el.dataset.edit;}); if(!t) return; S.modal={type:'editTask', id:t.id}; S.ed=Object.assign({},t); render(); }); });
  document.querySelectorAll('[data-del]').forEach(function(el){ el.addEventListener('click', function(){ if(!confirm('이 업무를 삭제하시겠습니까?')) return; S.data.tasks=S.data.tasks.filter(function(t){return t.id!==+el.dataset.del;}); saveData(); render(); }); });
  document.querySelectorAll('[data-statusid]').forEach(function(el){ el.addEventListener('change', function(){ const t=S.data.tasks.find(function(x){return x.id===+el.dataset.statusid;}); if(t){ t.status=el.value; saveData(); render(); } }); });
  const mc = document.getElementById('m-cancel'); if(mc) mc.addEventListener('click', function(){ S.modal=null; render(); });
  const mbg = document.getElementById('mbg'); if(mbg) mbg.addEventListener('click', function(){ S.modal=null; render(); });
  const msv = document.getElementById('m-save'); if(msv) msv.addEventListener('click', saveTaskForm);
  const mdl = document.getElementById('m-del'); if(mdl) mdl.addEventListener('click', function(){ if(!confirm('이 업무를 삭제하시겠습니까?')) return; S.data.tasks=S.data.tasks.filter(function(t){return t.id!==S.modal.id;}); saveData(); S.modal=null; render(); });
  const mcl = document.getElementById('m-close'); if(mcl) mcl.addEventListener('click', function(){ S.modal=null; render(); });
  const lfs = document.getElementById('lf-show'); if(lfs) lfs.addEventListener('click', function(){ S.modal.showLogForm=true; render(); });
  const lfc = document.getElementById('lf-cancel'); if(lfc) lfc.addEventListener('click', function(){ S.modal.showLogForm=false; render(); });
  const lfsave = document.getElementById('lf-save');
  if(lfsave) lfsave.addEventListener('click', function(){
    const t=S.data.tasks.find(function(x){return x.id===S.modal.id;}); if(!t) return;
    const c=document.getElementById('lf-content').value.trim();
    if(!c){ alert('진행 내용을 입력하세요.'); return; }
    t.logs.push({ id:uid(t.logs), date:document.getElementById('lf-date').value||td(), author:document.getElementById('lf-author').value.trim()||'미입력', content:c });
    saveData(); S.modal.showLogForm=false; render();
  });
  document.querySelectorAll('[data-dellog]').forEach(function(el){ el.addEventListener('click', function(){
    const t=S.data.tasks.find(function(x){return x.id===+el.dataset.dellog;}); if(!t) return;
    t.logs=t.logs.filter(function(l){return l.id!==+el.dataset.lid;}); saveData(); render();
  }); });
  const ipc = document.getElementById('ip-cancel'); if(ipc) ipc.addEventListener('click', function(){ S.page='dashboard'; render(); });
  const ips = document.getElementById('ip-save');
  if(ips) ips.addEventListener('click', function(){
    const title=document.getElementById('f-title').value.trim();
    if(!title){ alert('업무명을 입력하세요.'); return; }
    S.data.tasks.push(readTaskForm(uid(S.data.tasks)));
    saveData(); S.page='dashboard'; S.kpiFilter='전체'; render();
  });
  const ot = document.getElementById('org-team'); if(ot) ot.addEventListener('change', function(e){ S.orgTeamFilter=e.target.value; render(); });
  const om = document.getElementById('org-member'); if(om) om.addEventListener('change', function(e){ S.orgMemberFilter=e.target.value; render(); });
  document.querySelectorAll('[data-grade]').forEach(function(el){ el.addEventListener('click', function(){ S.orgGrade=el.dataset.grade; render(); }); });
  document.querySelectorAll('[data-orgsort]').forEach(function(el){ el.addEventListener('click', function(){ S.orgSort=el.dataset.orgsort; render(); }); });
  const oab = document.getElementById('org-add-btn'); if(oab) oab.addEventListener('click', function(){ S.modal={type:'addOrg'}; S.ed={date:td(), team:S.data.teams[0].name, grade:'A'}; render(); });
  document.querySelectorAll('[data-orgedit]').forEach(function(el){ el.addEventListener('click', function(){ const l=S.data.orgLogs.find(function(x){return x.id===+el.dataset.orgedit;}); if(!l) return; S.modal={type:'editOrg', id:l.id}; S.ed=Object.assign({},l); render(); }); });
  document.querySelectorAll('[data-orgdel]').forEach(function(el){ el.addEventListener('click', function(){ if(!confirm('이 일지를 삭제하시겠습니까?')) return; S.data.orgLogs=S.data.orgLogs.filter(function(l){return l.id!==+el.dataset.orgdel;}); saveData(); render(); }); });
  const ocancel = document.getElementById('o-cancel'); if(ocancel) ocancel.addEventListener('click', function(){ S.modal=null; render(); });
  const osave = document.getElementById('o-save');
  if(osave) osave.addEventListener('click', function(){
    const member=document.getElementById('o-member').value.trim();
    const content=document.getElementById('o-content').value.trim();
    if(!member || !content){ alert('구성원과 내역을 입력하세요.'); return; }
    const obj={ date:document.getElementById('o-date').value||td(), team:document.getElementById('o-team').value, member:member, grade:document.getElementById('o-grade').value, content:content };
    if(S.modal.type==='editOrg'){ const l=S.data.orgLogs.find(function(x){return x.id===S.modal.id;}); if(l) Object.assign(l,obj); }
    else { S.data.orgLogs.push(Object.assign({id:uid(S.data.orgLogs)}, obj)); }
    saveData(); S.modal=null; render();
  });
  const odel = document.getElementById('o-del'); if(odel) odel.addEventListener('click', function(){ if(!confirm('이 일지를 삭제하시겠습니까?')) return; S.data.orgLogs=S.data.orgLogs.filter(function(l){return l.id!==S.modal.id;}); saveData(); S.modal=null; render(); });
  document.querySelectorAll('[data-teamname]').forEach(function(el){ el.addEventListener('change', function(){
    const i=+el.dataset.teamname; const oldName=S.data.teams[i].name; const newName=el.value.trim();
    if(!newName) return;
    S.data.teams[i].name=newName;
    S.data.tasks.forEach(function(t){ if(t.team===oldName) t.team=newName; });
    S.data.orgLogs.forEach(function(l){ if(l.team===oldName) l.team=newName; });
    saveData(); render();
  }); });
  const acb = document.getElementById('add-cat-btn'); if(acb) acb.addEventListener('click', addCatFromInput);
  const ncat = document.getElementById('new-cat'); if(ncat) ncat.addEventListener('keydown', function(e){ if(e.key==='Enter') addCatFromInput(); });
  const atmb = document.getElementById('add-team-btn'); if(atmb) atmb.addEventListener('click', addTeamFromInput);
  const ntm = document.getElementById('new-team'); if(ntm) ntm.addEventListener('keydown', function(e){ if(e.key==='Enter') addTeamFromInput(); });
  document.querySelectorAll('[data-rmteam]').forEach(function(el){ el.addEventListener('click', function(){
    const i = +el.dataset.rmteam;
    if(S.data.teams.length <= 1){ alert('최소 1개 팀은 유지해야 합니다.'); return; }
    const team = S.data.teams[i];
    const affectedTasks = S.data.tasks.filter(function(t){return t.team===team.name;}).length;
    const affectedLogs = S.data.orgLogs.filter(function(l){return l.team===team.name;}).length;
    let msg = "'"+team.name+"' 팀을 삭제하시겠습니까?";
    if(affectedTasks || affectedLogs) msg += '\n소속 업무 '+affectedTasks+'건, 조직관리일지 '+affectedLogs+'건은 다른 팀으로 자동 이동됩니다.';
    if(!confirm(msg)) return;
    S.data.teams.splice(i,1);
    const fallback = S.data.teams[0].name;
    S.data.tasks.forEach(function(t){ if(t.team===team.name) t.team=fallback; });
    S.data.orgLogs.forEach(function(l){ if(l.team===team.name) l.team=fallback; });
    saveData(); render();
  }); });
  document.querySelectorAll('[data-rmcat]').forEach(function(el){ el.addEventListener('click', function(){
    const cat=el.dataset.rmcat;
    if(!confirm("'"+cat+"' 분류를 사용 중인 업무는 분류가 비워집니다. 계속하시겠습니까?")) return;
    S.data.tasks.forEach(function(t){ if(t.category===cat) t.category=''; });
    S.data.extraCategories = (S.data.extraCategories||[]).filter(function(c){return c!==cat;});
    saveData(); render();
  }); });
  const rb = document.getElementById('reset-btn'); if(rb) rb.addEventListener('click', function(){
    if(!confirm('모든 업무와 조직관리일지를 삭제합니다. 계속하시겠습니까?')) return;
    S.data.tasks=[]; S.data.orgLogs=[]; saveData(); render();
  });
}

S.data = loadData();
saveData();
render();
</script>
</body>
</html>
